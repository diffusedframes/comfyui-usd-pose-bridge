name: Prepare GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Match version to tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/check_release.py --tag "$RELEASE_TAG"
      - name: Build installable ZIP
        run: python tools/build_release.py
      - name: Create draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft)
          if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.zip \
            --verify-tag --title "DiffusedFrames USD Pose Bridge $RELEASE_TAG" \
            --generate-notes "${flags[@]}"
