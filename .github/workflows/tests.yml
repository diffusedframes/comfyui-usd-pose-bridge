name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test when called by a release workflow
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU Torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install pack and test tools
        run: python -m pip install -e ".[test]"
      - name: Check source
        run: python -m ruff check .
      - name: Check release metadata
        run: python tools/check_release.py
      - name: Test with real USD and Torch
        run: python -m pytest -q
