[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusedframes-usd-pose-bridge"
version = "0.1.0"
description = "DiffusedFrames camera-aware OpenUSD skeleton animation to OpenPose for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "DiffusedFrames" }]
keywords = ["comfyui", "openusd", "usd", "openpose", "animation", "controlnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["usd-core>=25.5,<27", "numpy>=1.24", "Pillow>=10.0"]

[project.urls]
Repository = "https://github.com/diffusedframes/comfyui-usd-pose-bridge"
Documentation = "https://github.com/diffusedframes/comfyui-usd-pose-bridge/blob/main/README.md"
"Bug Tracker" = "https://github.com/diffusedframes/comfyui-usd-pose-bridge/issues"

[project.optional-dependencies]
test = ["pytest>=8", "torch>=2.2", "ruff>=0.11", "tomli>=2; python_version < '3.11'"]

[tool.comfy]
DisplayName = "DiffusedFrames USD Pose Bridge"
PublisherId = "diffusedframes"

[tool.setuptools.packages.find]
include = ["usd_pose_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
